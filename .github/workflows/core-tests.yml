name: 核心逻辑测试

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: 情绪模型与确定性映射
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: 获取代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 执行核心逻辑测试
        run: bash scripts/test-core.sh
